spring:
  application:
    name: portal-solicitacoes-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

portal:
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: portal-solicitacoes
      audience: portal-solicitacoes-api
    access-token-validade: 15m
    sessao-validade: 8h
    cookie-secure: ${AUTH_COOKIE_SECURE:false}

springdoc:
  packages-to-scan: br.com.wenned.portalsolicitacoes.presentation.controller
  paths-to-match: /api/v1/**
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    persist-authorization: false
    operations-sorter: method
    tags-sorter: alpha